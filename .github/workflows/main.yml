name: Compile PDFs

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Traditional-Chinese glyphs need a CJK font present (the luaotfload
    # fallback in awesome-cv.cls points at "Noto Sans CJK TC"). This mirrors
    # docker/Dockerfile -- keep the two in sync.
    - name: Install CJK fonts
      run: |
        apt-get update
        apt-get install -y --no-install-recommends fonts-noto-cjk
        fc-cache -f
        # Refresh luaotfload's name database so the just-installed CJK font is
        # found on first lookup (otherwise the first compile triggers a noisy
        # "Font not found -> Reload initiated" rebuild mid-run).
        luaotfload-tool --update

    - name: Compile
      run: make

    - uses: actions/upload-artifact@v4
      with:
        name: examples
        # The Makefile writes PDFs to examples/tex_output/ (not examples/).
        path: examples/tex_output/*.pdf
