# Reproducible build environment for Awesome-CV.
#
# Run from anywhere; paths below are relative to this file (docker/).
# The build context and the bind mount are the repository root (..), so the
# container compiles the real sources and writes PDFs back to your working tree.
#
#   # Build every example PDF (resume, cv, coverletter) -> examples/tex_output/
#   docker compose -f docker/docker-compose.yaml run --rm cv
#
#   # Build just the resume
#   docker compose -f docker/docker-compose.yaml run --rm cv make resume.pdf
#
#   # Run lualatex directly (compile from the repo root so \input paths resolve)
#   docker compose -f docker/docker-compose.yaml run --rm cv \
#     lualatex -interaction=nonstopmode -output-directory=examples/tex_output examples/resume.tex
#
#   # Open a shell to poke around (fc-list, kpsewhich, ...)
#   docker compose -f docker/docker-compose.yaml run --rm cv bash

services:
  cv:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: awesome-cv-build:latest
    working_dir: /work
    volumes:
      - ..:/work
    command: ["make"]
